{# templates/403.html #}
{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5 text-center">
          <div class="display-6 fw-bold mb-2">403</div>
          <p class="text-muted mb-4">
            No tenés permisos para acceder a esta página.
          </p>

          <div class="d-flex gap-2 justify-content-center">
            <a class="btn btn-primary" href="{% url 'dashboard:home' %}">Volver al inicio</a>
            <a class="btn btn-outline-secondary" href="{% url 'login' %}">Iniciar sesión</a>
          </div>

          <div class="mt-4 small text-muted">
            Si creés que esto es un error, contactá al administrador.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
